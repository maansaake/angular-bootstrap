name: Deploy to GitHub Pages

run-name: 'Deploy to GitHub Pages'

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Never deploy something that wouldn't pass the main branch checks.
  lint:
    uses: ./.github/workflows/callable-lint.yaml

  test:
    uses: ./.github/workflows/callable-test.yaml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - run: make install/cli

      - run: make install

      - name: Codegen
        run: make codegen

      - name: Build for production
        run: make build/prod

      # GitHub Pages has no SPA fallback: serve the app for unknown paths so deep links work.
      - name: Add SPA fallback
        run: cp dist/angular-bootstrap/browser/index.html dist/angular-bootstrap/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/angular-bootstrap/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
