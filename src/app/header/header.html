<header>
  <mat-toolbar color="primary" class="header-toolbar">
    <h1 class="header-title">
      <a routerLink="/" aria-label="Go to landing page">
        <span>Angular Bootstrap</span>
      </a>
    </h1>
    <span class="spacer"></span>
    @if (authService.loggedIn()) {
    <button matButton="filled" color="accent" (click)="onProfile()">
      <mat-icon>account_circle</mat-icon>
      <span>Profile</span>
    </button>
    <button matButton="outlined" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
    } @else {
    <button matButton="outlined" (click)="onRegister()">
      <mat-icon>person_add</mat-icon>
      <span>Register</span>
    </button>
    <button matButton="filled" color="accent" (click)="onLogin()">
      <mat-icon>login</mat-icon>
      <span>Log in</span>
    </button>
    }
  </mat-toolbar>
</header>
