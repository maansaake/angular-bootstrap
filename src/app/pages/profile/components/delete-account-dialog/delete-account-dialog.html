<h2 mat-dialog-title>Delete your account?</h2>
<mat-dialog-content>
  <p>
    This permanently deletes <strong>{{ username }}</strong> and logs you out. It cannot be undone.
  </p>
  <mat-form-field class="confirmation">
    <mat-label>Type your username to confirm</mat-label>
    <input matInput [formField]="form.confirmation" autocomplete="off" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button
    matButton="filled"
    class="danger-button"
    [mat-dialog-close]="true"
    [disabled]="!confirmed()"
  >
    Delete account
  </button>
</mat-dialog-actions>
