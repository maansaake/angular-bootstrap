<div class="page page-narrow">
  <h1 class="page-title">Log in</h1>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <form class="form-stack" novalidate (submit)="onSubmit($event)">
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input matInput [formField]="form.username" autocomplete="username" />
      <mat-error>{{ form.username().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" [formField]="form.password" autocomplete="current-password" />
      <mat-error>{{ form.password().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <button matButton="filled" type="submit" [disabled]="form().submitting()" disabledInteractive>
      {{ form().submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p>No account yet? <a routerLink="/register">Create one</a>.</p>
</div>
